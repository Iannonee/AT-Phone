<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AT Phone</title>
<link rel="stylesheet" href="style.css">
<style>
/* ============================================================
   HOME SCREEN STYLES
   ============================================================ */

html, body {
    background: transparent;
    overflow: hidden;
}

/* Wrapper posizionato bottom-right */
#phone-wrapper {
    position: fixed;
    bottom: 24px;
    right: 32px;
    z-index: 9999;
    transform: translateY(120%) scale(0.85);
    opacity: 0;
    transition: transform 0.42s cubic-bezier(0.34,1.56,0.64,1),
                opacity   0.32s ease;
    pointer-events: none;
}

#phone-wrapper.open {
    transform: translateY(0) scale(1);
    opacity: 1;
    pointer-events: all;
}

/* Corpo fisico del telefono */
#phone-body {
    width: 320px;
    height: 680px;
    background: var(--bg);
    border-radius: 44px;
    box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 40px 80px rgba(0,0,0,0.7),
        0 20px 40px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.06);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
}

/* ============================================================
   Dynamic Island
   ============================================================ */
#dynamic-island {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    width: 110px;
    height: 32px;
    background: #000;
    border-radius: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.6);
    transition: width 0.3s var(--spring), height 0.3s var(--spring);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

#dynamic-island.expanded {
    width: 260px;
    height: 52px;
    border-radius: 26px;
}

#di-call-info {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 0 14px;
    width: 100%;
}

#di-call-info.active { display: flex; }

.di-call-name {
    font-size: 13px;
    font-weight: 500;
    color: #fff;
    flex: 1;
}

.di-call-timer {
    font-size: 13px;
    color: var(--green);
    font-variant-numeric: tabular-nums;
}

.di-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.5; transform: scale(0.8); }
}

/* ============================================================
   Status Bar
   ============================================================ */
#status-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px 4px;
    flex-shrink: 0;
    height: 50px;
}

.status-time {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.3px;
}

.status-icons {
    display: flex;
    align-items: center;
    gap: 6px;
}

.status-icons svg { display: block; }

/* ============================================================
   Home Screen (visibile quando nessuna app è aperta)
   ============================================================ */
#home-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
}

/* Data */
#home-date {
    text-align: center;
    padding: 6px 0 10px;
}

.date-day-name {
    font-size: 13px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.date-day-number {
    font-size: 42px;
    font-weight: 200;
    color: var(--text);
    line-height: 1;
    letter-spacing: -2px;
}

/* Notifiche */
#notifications-area {
    padding: 0 12px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 0;
}

.notif-card {
    background: var(--surface);
    border-radius: var(--radius);
    padding: 10px 14px;
    border: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    gap: 10px;
    animation: fadeIn 0.2s ease;
}

.notif-app-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.notif-content { flex: 1; min-width: 0; }

.notif-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
}

.notif-body {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.notif-time {
    font-size: 11px;
    color: var(--text-subtle);
    flex-shrink: 0;
}

/* ============================================================
   App Grid
   ============================================================ */
#app-grid {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px 8px;
    padding: 8px 12px 12px;
    overflow: hidden;
    align-content: start;
}

.app-icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
    position: relative;
    transition: transform var(--transition);
}

.app-icon:active { transform: scale(0.88); }

.app-icon-img {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
}

.app-icon-label {
    font-size: 10px;
    color: var(--text);
    text-align: center;
    line-height: 1.2;
    max-width: 64px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.app-badge {
    position: absolute;
    top: -3px;
    right: 4px;
    background: var(--red);
    color: #fff;
    border-radius: 99px;
    font-size: 10px;
    font-weight: 700;
    min-width: 16px;
    height: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4px;
    border: 1.5px solid var(--bg);
    display: none;
}

.app-badge.visible { display: flex; }

/* ============================================================
   Dock
   ============================================================ */
#dock {
    margin: 0 10px 10px;
    background: rgba(255,255,255,0.06);
    border-radius: 26px;
    border: 1px solid var(--border);
    padding: 10px 6px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    flex-shrink: 0;
}

#dock .app-icon-label { display: none; }

#dock .app-icon-img {
    width: 52px;
    height: 52px;
}

/* ============================================================
   Home Indicator
   ============================================================ */
#home-indicator {
    display: flex;
    justify-content: center;
    padding-bottom: 10px;
    flex-shrink: 0;
}

#home-indicator-bar {
    width: 120px;
    height: 4px;
    background: rgba(255,255,255,0.25);
    border-radius: 2px;
}

/* ============================================================
   App Frame (iframe per le app)
   ============================================================ */
#app-frame-container {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    z-index: 10;
    border-radius: 44px;
    overflow: hidden;
}

#app-frame-container.visible {
    display: flex;
}

#app-iframe {
    flex: 1;
    width: 100%;
    border: none;
    background: var(--bg);
    display: block;
}

/* ============================================================
   Overlay chiamata in arrivo (sopra tutto)
   ============================================================ */
#incoming-call-overlay {
    display: none;
    position: absolute;
    inset: 0;
    z-index: 50;
    border-radius: 44px;
    overflow: hidden;
}

#incoming-call-overlay.visible { display: block; }

</style>
</head>
<body>
<div id="phone-wrapper">
  <div id="phone-body">

    <!-- Dynamic Island -->
    <div id="dynamic-island">
      <div id="di-call-info">
        <div class="di-dot"></div>
        <span class="di-call-name" id="di-name">Chiamata</span>

          <rect x="4"  y="5" width="3" height="7" rx="1" fill="rgba(255,255,255,0.88)"/>
          <rect x="8"  y="3" width="3" height="9" rx="1" fill="rgba(255,255,255,0.88)"/>
          <rect x="12" y="0" width="3" height="12" rx="1" fill="rgba(255,255,255,0.88)"/>

          <path d="M8 9a1.5 1.5 0 110 3 1.5 1.5 0 010-3z" fill="rgba(255,255,255,0.88)"/>

          <path d="M1.5 4.1C3.1 2.5 5.4 1.5 8 1.5s4.9 1 6.5 2.6" stroke="rgba(255,255,255,0.88)" stroke-width="1.5" stroke-linecap="round" fill="none"/>

          <rect x="0.5" y="0.5" width="17" height="11" rx="3" stroke="rgba(255,255,255,0.5)"/>
          <rect x="2" y="2" width="13" height="8" rx="2" fill="rgba(255,255,255,0.88)"/>
          <path d="M18.5 4v4" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <!-- Home Screen -->
    <div id="home-screen">

      <!-- Data -->
      <div id="home-date">

      <!-- Area notifiche (max 2) -->
      <div id="notifications-area"></div>

      <!-- Griglia app 4x3 -->

            </svg>

        </div>
        <!-- Banca -->
        <div class="app-icon" data-app="bank">

        <!-- Mappe -->

        </div>
        <!-- Garage -->

          <div class="app-icon-img" style="background:linear-gradient(145deg,#004a52,#30d158)">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

            </svg>

          <span class="app-icon-label">Impostazioni</span>

      <!-- Dock -->

          <div class="app-icon-img" style="background:linear-gradient(145deg,#1a6b2e,#34c759)">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.79 12a19.79 19.79 0 01-3.07-8.67A2 2 0 012.7 1.28h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 9a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>

          <div class="app-icon-img" style="background:linear-gradient(145deg,#1a6b2e,#34c759)">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
            </svg>
          </div>
        </div>
        <div class="app-icon" data-app="bank">
          <div class="app-icon-img" style="background:linear-gradient(145deg,#0a5c9e,#0a84ff)">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
          </div>
        </div>
        <div class="app-icon" data-app="contacts">
          <div class="app-icon-img" style="background:linear-gradient(145deg,#8c3a00,#ff9f0a)">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Home Indicator -->
      <div id="home-indicator">
        <div id="home-indicator-bar"></div>
      </div>
    </div><!-- /home-screen -->

    <!-- Contenitore iframe per le app -->
    <div id="app-frame-container">
      <iframe id="app-iframe" allowtransparency="true"></iframe>
    </div>

  </div><!-- /phone-body -->
</div><!-- /phone-wrapper -->

<script src="app.js"></script>
</body>
</html>
