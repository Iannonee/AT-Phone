<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contatti</title>
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="contacts.css">
</head>
<body>

<!-- ============================================================
     SCHERMATA 1 — Lista contatti
     ============================================================ -->
<div id="screen-list" class="screen active">
  <div class="app-navbar">
    <span style="min-width:60px"></span>
    <span class="app-navbar-title">Contatti</span>
    <button class="nav-btn right" id="btn-add-contact">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
    </button>
  </div>

  <div class="search-bar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="search-input" placeholder="Cerca…">
  </div>

  <div id="contacts-list" style="flex:1;overflow-y:auto;">
    <!-- Popolato via JS -->
  </div>
</div>

<!-- ============================================================
     SCHERMATA 2 — Scheda contatto
     ============================================================ -->
<div id="screen-card" class="screen">
  <div class="app-navbar">
    <button class="nav-btn" id="btn-back-card">
      <svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="8 2 2 8 8 14"/>
      </svg>
      Indietro
    </button>
    <span class="app-navbar-title">Contatto</span>
    <button class="nav-btn right" id="btn-edit-contact" style="color:var(--blue)">Modifica</button>
  </div>

  <div id="contact-card-content" style="flex:1;overflow-y:auto;"></div>
</div>

<!-- ============================================================
     SCHERMATA 3 — Aggiungi / Modifica contatto
     ============================================================ -->
<div id="screen-add" class="screen">
  <div class="app-navbar">
    <button class="nav-btn" id="btn-cancel-add">Annulla</button>
    <span class="app-navbar-title" id="add-title">Nuovo contatto</span>
    <span style="min-width:60px"></span>
  </div>

  <div style="flex:1;overflow-y:auto;padding:20px 16px;">
    <!-- Avatar placeholder -->
    <div class="new-contact-avatar">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    </div>

    <div class="form-field">
      <label class="form-label">Nome *</label>
      <input type="text" class="form-input" id="field-name" placeholder="Mario">
    </div>
    <div class="form-field">
      <label class="form-label">Cognome (opzionale)</label>
      <input type="text" class="form-input" id="field-lastname" placeholder="Rossi">
    </div>
    <div class="form-field">
      <label class="form-label">Numero *</label>
      <input type="text" class="form-input" id="field-number" placeholder="555-0000" id="field-number">
    </div>
    <div class="form-field">
      <label class="form-label">Note (opzionale)</label>
      <textarea class="form-input" id="field-notes" placeholder="Aggiungi nota…"></textarea>
    </div>

    <button class="btn btn-green btn-full" id="btn-save-contact" style="margin-top:8px">Salva contatto</button>
    <button class="btn btn-ghost btn-full" id="btn-cancel-add2" style="margin-top:8px">Annulla</button>
  </div>
</div>

<script src="contacts.js"></script>
</body>
</html>
