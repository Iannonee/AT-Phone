<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messaggi</title>
<link rel="stylesheet" href="../../style.css">
<link rel="stylesheet" href="messages.css">
</head>
<body>

<!-- ============================================================
     SCHERMATA 1 — Lista conversazioni
     ============================================================ -->
<div id="screen-list" class="screen active">

  <div class="app-navbar">
    <button class="nav-btn" id="btn-close">
      <svg width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="8 1 2 7.5 8 14"/>
      </svg>
    </button>
    <span class="app-navbar-title">Messaggi</span>
    <button class="nav-btn right" id="btn-compose">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
        <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
      </svg>
    </button>
  </div>

  <div class="search-bar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="search-input" placeholder="Cerca">
  </div>

  <div id="conv-list">
    <div class="empty-state" id="empty-convs">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
      </svg>
      <p>Nessuna conversazione</p>
    </div>
  </div>

</div>

<!-- ============================================================
     SCHERMATA 2 — Chat
     ============================================================ -->
<div id="screen-chat" class="screen">

  <div class="app-navbar">
    <button class="nav-btn" id="btn-back">
      <svg width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="8 1 2 7.5 8 14"/>
      </svg>
      Indietro
    </button>
    <div class="chat-nav-center">
      <span class="chat-nav-name" id="chat-contact-name"></span>
      <span class="chat-nav-status" id="chat-contact-status"></span>
    </div>
    <button class="nav-btn right" id="btn-call-contact">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--green)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.79 12a19.79 19.79 0 01-3.07-8.67A2 2 0 012.7 1.28h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.91 9a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/>
      </svg>
    </button>
  </div>

  <div id="messages-area"></div>

  <!-- Menu allegati — appare sopra il tasto + -->
  <div class="attach-menu" id="attach-menu">
    <button class="attach-option" data-type="image">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
      </svg>
      Immagine
    </button>
    <div class="attach-sep"></div>
    <button class="attach-option" data-type="location">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/>
      </svg>
      Posizione
    </button>
  </div>

  <!-- Input bar -->
  <div class="input-bar">
    <button class="input-circle-btn" id="btn-attach">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
    </button>
    <div contenteditable="true" id="msg-input" class="msg-input" data-placeholder="Messaggio"></div>
    <button class="send-btn" id="btn-send">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
      </svg>
    </button>
  </div>

</div>

<script src="messages.js"></script>
</body>
</html>
