<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telefono</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/apps/calls/calls.css" />
</head>
<body>

  <!-- =========================================================
       STATE 1 — DIALPAD (default visible)
       ========================================================= -->
  <div id="state-dialpad" class="call-state active">

    <nav class="app-navbar">
      <button class="nav-btn" id="btn-close-app" aria-label="Indietro">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="rgba(255,255,255,0.88)" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <span class="navbar-title">Telefono</span>
      <span class="navbar-right"></span>
    </nav>

    <div class="number-display">
      <span id="dial-number" class="dial-number-text"></span>
      <span id="dial-placeholder" class="dial-placeholder">Inserisci numero</span>
    </div>

    <div class="dial-grid">
      <button class="dial-key" data-digit="1">
        <span class="dial-digit">1</span>
        <span class="dial-sub">&nbsp;</span>
      </button>
      <button class="dial-key" data-digit="2">
        <span class="dial-digit">2</span>
        <span class="dial-sub">ABC</span>
      </button>
      <button class="dial-key" data-digit="3">
        <span class="dial-digit">3</span>
        <span class="dial-sub">DEF</span>
      </button>

      <button class="dial-key" data-digit="4">
        <span class="dial-digit">4</span>
        <span class="dial-sub">GHI</span>
      </button>
      <button class="dial-key" data-digit="5">
        <span class="dial-digit">5</span>
        <span class="dial-sub">JKL</span>
      </button>
      <button class="dial-key" data-digit="6">
        <span class="dial-digit">6</span>
        <span class="dial-sub">MNO</span>
      </button>

      <button class="dial-key" data-digit="7">
        <span class="dial-digit">7</span>
        <span class="dial-sub">PQRS</span>
      </button>
      <button class="dial-key" data-digit="8">
        <span class="dial-digit">8</span>
        <span class="dial-sub">TUV</span>
      </button>
      <button class="dial-key" data-digit="9">
        <span class="dial-digit">9</span>
        <span class="dial-sub">WXYZ</span>
      </button>

      <button class="dial-key" data-digit="*">
        <span class="dial-digit">*</span>
        <span class="dial-sub">&nbsp;</span>
      </button>
      <button class="dial-key" data-digit="0">
        <span class="dial-digit">0</span>
        <span class="dial-sub">+</span>
      </button>
      <button class="dial-key" data-digit="#">
        <span class="dial-digit">#</span>
        <span class="dial-sub">&nbsp;</span>
      </button>
    </div>

    <div class="action-row">
      <div class="action-placeholder"></div>

      <button class="action-circle dial-call-btn" id="btn-dial" aria-label="Chiama">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="#ffffff" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.92v3a2 2 0 01-2.18 2
                   19.79 19.79 0 01-8.63-3.07
                   A19.5 19.5 0 013.09 9.81
                   a19.79 19.79 0 01-3.07-8.67
                   A2 2 0 012 .99h3a2 2 0 012 1.72
                   c.127.96.361 1.903.7 2.81
                   a2 2 0 01-.45 2.11L6.09 8.91
                   a16 16 0 006 6l1.27-1.27
                   a2 2 0 012.11-.45
                   c.907.339 1.85.573 2.81.7
                   A2 2 0 0122 16.92z"></path>
        </svg>
      </button>

      <button class="action-circle backspace-btn" id="btn-backspace" aria-label="Cancella">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
             stroke="rgba(255,255,255,0.35)" stroke-width="1.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 4H8l-7 8 7 8h13a2 2 0 002-2V6a2 2 0 00-2-2z"></path>
          <line x1="18" y1="9" x2="12" y2="15"></line>
          <line x1="12" y1="9" x2="18" y2="15"></line>
        </svg>
      </button>
    </div>

    <div class="recent-calls-container">
      <div class="section-label">RECENTI</div>
      <div id="recent-calls-list"></div>
    </div>

  </div>


  <!-- =========================================================
       STATE 2 — OUTGOING CALL
       ========================================================= -->
  <div id="state-outgoing" class="call-state">

    <div class="call-navbar-spacer"></div>

    <div class="call-center">
      <div class="avatar xl" id="out-avatar"></div>
      <span class="call-name" id="out-name"></span>
      <span class="call-status dots" id="out-status">Chiamata in corso</span>
    </div>

    <div class="call-actions">
      <div class="action-wrap">
        <button class="action-circle mute-circle" id="btn-mute-out" aria-label="Muto">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="rgba(255,255,255,0.88)" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M9 9v3a3 3 0 005.12 2.12M15 9.34V4a3 3 0 00-5.94-.6"></path>
            <path d="M17 16.95A7 7 0 015 12v-2m14 0v2a7 7 0 01-.11 1.23"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
        <span class="action-label">Muto</span>
      </div>

      <div class="action-wrap">
        <button class="action-circle hangup-circle" id="btn-hangup-out" aria-label="Fine chiamata">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="#ffffff" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round"
               style="transform:rotate(135deg)">
            <path d="M22 16.92v3a2 2 0 01-2.18 2
                     19.79 19.79 0 01-8.63-3.07
                     A19.5 19.5 0 013.09 9.81
                     a19.79 19.79 0 01-3.07-8.67
                     A2 2 0 012 .99h3a2 2 0 012 1.72
                     c.127.96.361 1.903.7 2.81
                     a2 2 0 01-.45 2.11L6.09 8.91
                     a16 16 0 006 6l1.27-1.27
                     a2 2 0 012.11-.45
                     c.907.339 1.85.573 2.81.7
                     A2 2 0 0122 16.92z"></path>
          </svg>
        </button>
        <span class="action-label">Fine</span>
      </div>

      <div class="action-wrap">
        <button class="action-circle speaker-circle" id="btn-speaker-out" aria-label="Speaker">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="rgba(255,255,255,0.88)" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 010 14.14"></path>
            <path d="M15.54 8.46a5 5 0 010 7.07"></path>
          </svg>
        </button>
        <span class="action-label">Speaker</span>
      </div>
    </div>

  </div>


  <!-- =========================================================
       STATE 3 — INCOMING CALL
       ========================================================= -->
  <div id="state-incoming" class="call-state">

    <div class="call-navbar-spacer"></div>

    <div class="call-center">
      <span class="incoming-label">Chiamata in arrivo</span>
      <div class="avatar xl" id="inc-avatar"></div>
      <span class="call-name" id="inc-name"></span>
    </div>

    <div class="call-actions" style="gap:64px;">
      <div class="action-wrap">
        <button class="action-circle hangup-circle" id="btn-decline" aria-label="Rifiuta">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="#ffffff" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round"
               style="transform:rotate(135deg)">
            <path d="M22 16.92v3a2 2 0 01-2.18 2
                     19.79 19.79 0 01-8.63-3.07
                     A19.5 19.5 0 013.09 9.81
                     a19.79 19.79 0 01-3.07-8.67
                     A2 2 0 012 .99h3a2 2 0 012 1.72
                     c.127.96.361 1.903.7 2.81
                     a2 2 0 01-.45 2.11L6.09 8.91
                     a16 16 0 006 6l1.27-1.27
                     a2 2 0 012.11-.45
                     c.907.339 1.85.573 2.81.7
                     A2 2 0 0122 16.92z"></path>
          </svg>
        </button>
        <span class="action-label">Rifiuta</span>
      </div>

      <div class="action-wrap">
        <button class="action-circle answer-circle ring-pulse" id="btn-answer" aria-label="Rispondi">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="#ffffff" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 01-2.18 2
                     19.79 19.79 0 01-8.63-3.07
                     A19.5 19.5 0 013.09 9.81
                     a19.79 19.79 0 01-3.07-8.67
                     A2 2 0 012 .99h3a2 2 0 012 1.72
                     c.127.96.361 1.903.7 2.81
                     a2 2 0 01-.45 2.11L6.09 8.91
                     a16 16 0 006 6l1.27-1.27
                     a2 2 0 012.11-.45
                     c.907.339 1.85.573 2.81.7
                     A2 2 0 0122 16.92z"></path>
          </svg>
        </button>
        <span class="action-label">Rispondi</span>
      </div>
    </div>

  </div>


  <!-- =========================================================
       STATE 4 — ACTIVE CALL
       ========================================================= -->
  <div id="state-active" class="call-state">

    <div class="call-navbar-spacer"></div>

    <div class="call-center">
      <div class="avatar xl" id="act-avatar"></div>
      <span class="call-name" id="act-name"></span>
      <span class="call-timer" id="act-timer">0:00</span>
    </div>

    <div class="call-actions">
      <div class="action-wrap">
        <button class="action-circle mute-circle" id="btn-mute" aria-label="Muto">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="rgba(255,255,255,0.88)" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <line x1="1" y1="1" x2="23" y2="23"></line>
            <path d="M9 9v3a3 3 0 005.12 2.12M15 9.34V4a3 3 0 00-5.94-.6"></path>
            <path d="M17 16.95A7 7 0 015 12v-2m14 0v2a7 7 0 01-.11 1.23"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
        <span class="action-label">Muto</span>
      </div>

      <div class="action-wrap">
        <button class="action-circle hangup-circle" id="btn-hangup" aria-label="Fine chiamata">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="#ffffff" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round"
               style="transform:rotate(135deg)">
            <path d="M22 16.92v3a2 2 0 01-2.18 2
                     19.79 19.79 0 01-8.63-3.07
                     A19.5 19.5 0 013.09 9.81
                     a19.79 19.79 0 01-3.07-8.67
                     A2 2 0 012 .99h3a2 2 0 012 1.72
                     c.127.96.361 1.903.7 2.81
                     a2 2 0 01-.45 2.11L6.09 8.91
                     a16 16 0 006 6l1.27-1.27
                     a2 2 0 012.11-.45
                     c.907.339 1.85.573 2.81.7
                     A2 2 0 0122 16.92z"></path>
          </svg>
        </button>
        <span class="action-label">Fine</span>
      </div>

      <div class="action-wrap">
        <button class="action-circle speaker-circle" id="btn-speaker" aria-label="Speaker">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
               stroke="rgba(255,255,255,0.88)" stroke-width="1.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 010 14.14"></path>
            <path d="M15.54 8.46a5 5 0 010 7.07"></path>
          </svg>
        </button>
        <span class="action-label">Speaker</span>
      </div>
    </div>

  </div>


  <script src="/apps/calls/calls.js"></script>
</body>
</html>
